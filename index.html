<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI R-Type</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    width: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="960" height="540"></canvas>
</div>
<script src="game.js"></script>
</body>
</html>
